<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="marked.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: sans-serif; font-size: 17px; line-height: 1.5; margin: 0; padding: 4px 2px 24px; }
  h1 { font-size: 1.3em; margin: 0.2em 0 0.6em; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .meta { opacity: 0.7; font-size: 0.9em; margin-bottom: 1em; }
  pre, code { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="content"></div>
<script>
// Les formules sont extraites avant Markdown (sinon « _ » et « * » seraient pris pour de l'italique),
// puis rendues par KaTeX et réinsérées.
function render(data) {
  var maths = [];
  var src = data.enonce.replace(/\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g, function (_, display, inline) {
    maths.push({ tex: display !== undefined ? display : inline, display: display !== undefined });
    return "@@MATH" + (maths.length - 1) + "@@";
  });
  var html = marked.parse(src);
  html = html.replace(/@@MATH(\d+)@@/g, function (_, i) {
    var m = maths[+i];
    try {
      return katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false });
    } catch (e) {
      return m.tex;
    }
  });
  var esc = function (s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
  document.getElementById("content").innerHTML =
    "<h1>" + esc(data.titre) + "</h1>" +
    (data.duree_min ? '<div class="meta">Durée indicative : ' + data.duree_min + " min</div>" : "") +
    html;
}
</script>
</body>
</html>
