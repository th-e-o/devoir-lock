# Génération du projet Xcode : brew install xcodegen && xcodegen generate
name: DevoirDuJour
options:
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DevoirDuJour:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/**"]
      - path: App/Resources/web
        type: folder
        buildPhase: resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).devoirdujour
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Devoir du jour
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Pour photographier les pages du devoir.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        DevoirServerURL: $(SERVER_URL)
        DevoirDeviceToken: $(DEVICE_TOKEN)
        DevoirDeviceID: $(DEVICE_ID)
        DevoirPublicKey: $(SERVER_PUBLIC_KEY)
        DevoirAdminPinSHA256: $(ADMIN_PIN_SHA256)
        DevoirAuthorization: $(AUTHORIZATION_MODE)
        DevoirAppGroup: $(APP_GROUP)
    entitlements:
      path: App/DevoirDuJour.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
    dependencies:
      - target: DevoirMonitor
      - target: DevoirShield

  DevoirMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Monitor
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).devoirdujour.monitor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: Devoir du jour - surveillance
        DevoirDeviceID: $(DEVICE_ID)
        DevoirPublicKey: $(SERVER_PUBLIC_KEY)
        DevoirAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Monitor
    entitlements:
      path: Monitor/DevoirMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]

  DevoirShield:
    type: app-extension
    platform: iOS
    sources:
      - ShieldUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).devoirdujour.shield
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ShieldUI/Info.plist
      properties:
        CFBundleDisplayName: Devoir du jour - écran de blocage
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfig
    entitlements:
      path: ShieldUI/DevoirShield.entitlements
      properties:
        com.apple.developer.family-controls: true
